<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ PANEL }}{% endblock %} · {{ APP }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">{{ APP }} <span class="brand-sub">· {{ PANEL }}</span></a>
  <nav>
    <a href="/">Дашборд</a>
    <a href="/campaigns">Кампании</a>
    <a href="/base">Получатели</a>
    <a href="/logs">Журнал</a>
    <a href="/settings">Настройки</a>
    <a class="exit" href="/logout">Выйти</a>
  </nav>
  <span class="badge {{ 'on' if worker_alive else 'off' }}">
    {{ 'воркер работает' if worker_alive else 'воркер остановлен' }}
  </span>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  {{ lan_ip }}:{{ port }} · {{ worker.status if worker else '—' }}
  {{ worker.detail if worker and worker.detail else '' }}
</footer>
</body>
</html>
