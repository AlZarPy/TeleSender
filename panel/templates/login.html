<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · {{ APP }} · {{ PANEL }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login card">
  <h1>{{ APP }}</h1>
  <p class="muted small">{{ PANEL }} — панель управления рассылкой.<br>{{ TAGLINE }}.</p>
  {% if error %}<p class="pill bad">неверный пароль</p>{% endif %}
  <form method="post" action="/login">
    <label>пароль<input type="password" name="password" autofocus required></label>
    <button type="submit">Войти</button>
  </form>
  <p class="muted small" style="margin-top:14px">Пароль — в <code>.env</code>, строка <code>PANEL_PASSWORD</code>.</p>
</div>
</body>
</html>
