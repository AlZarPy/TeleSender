# Панель «Почтамт» за nginx с HTTPS.
# Панель слушает только 127.0.0.1:8765 (см. docker-compose.yml) — снаружи её закрывает nginx.

server {
    listen 80;
    server_name pochtamt.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pochtamt.example.com;

    # сертификат: certbot --nginx -d pochtamt.example.com
    ssl_certificate     /etc/letsencrypt/live/pochtamt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pochtamt.example.com/privkey.pem;

    # не отдаём панель поисковикам и не даём встраивать в чужие страницы
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
