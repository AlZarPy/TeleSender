name: secret-scan

# Проверка на секреты. Хука недостаточно: его обходят через --no-verify,
# а этот workflow запускается на каждый push и PR и блокирует слияние.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  files:
    name: запрещённые файлы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить дерево
        run: |
          set -euo pipefail
          bad=$(git ls-files \
                | grep -Ei '(^|/)(config\.txt|\.env|proxies[^/]*\.txt|.*\.bak.*|.*\.session|.*\.db|.*\.jsonl|pending_code\.json|report_data\.json)$' \
                | grep -v 'proxies.example.txt' || true)
          if [ -n "$bad" ]; then
            echo "::error::В репозитории есть файлы с секретами"
            echo "$bad"
            exit 1
          fi
          echo "файлов с секретами в дереве нет"

  changes:
    name: секреты в изменениях
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверить добавленные строки
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1...HEAD"
            else
              range="$before...HEAD"
            fi
          fi
          echo "диапазон: $range"

          patterns='(api[_-]?key|secret|passw|token)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{12,}|socks5://[^:[:space:]]+:[^@[:space:]]+@|-----BEGIN [A-Z ]*PRIVATE KEY-----|[0-9]{10}:[A-Za-z0-9_-]{30,}'
          hits=$(git diff -U0 "$range" -- . \
                 | grep -E '^\+' \
                 | grep -v '^+++' \
                 | grep -Ein "$patterns" || true)
          if [ -n "$hits" ]; then
            echo "::error::Похоже на секрет в изменениях"
            echo "$hits" | cut -c1-160
            exit 1
          fi
          echo "в изменениях секретов не найдено"

  history:
    name: история (известные находки)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверить историю по списку исключений
        run: |
          set -euo pipefail
          known='^(proxies\.txt|proxies-pt\.txt|proxies\.txt\.bak\..*|pending_code\.json|report_data\.json)$'
          files=$(git log --all --pretty=format: --name-only | grep -Ev '^$' | sort -u || true)

          echo "известные файлы в истории (ожидаемо, нужна ротация):"
          printf '%s\n' "$files" | grep -E "$known" || echo "  — нет"

          new=$(printf '%s\n' "$files" \
                | grep -Ei '(^|/)(config\.txt|\.env|proxies[^/]*\.txt|.*\.session|.*\.db|.*\.jsonl)$' \
                | grep -Ev "$known" || true)
          if [ -n "$new" ]; then
            echo "::error::В истории появились новые файлы с секретами"
            echo "$new"
            exit 1
          fi
          echo "новых секретных файлов в истории нет"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
