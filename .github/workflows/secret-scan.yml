name: secret-scan

# Проверка на секреты: в коммитах и в дереве.
# Хук можно обойти (--no-verify), CI — нет: он запускается на каждый push и PR.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужна история для поиска по прошлым коммитам

      - name: Запрещённые файлы в дереве
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(config\.txt|\.env|proxies[^/]*\.txt|.*\.bak.*|.*\.session|.*\.db|.*\.jsonl|pending_code\.json|report_data\.json)$' \
                | grep -v 'proxies.example.txt' || true)
          if [ -n "$bad" ]; then echo "Найдены файлы с секретами:"; echo "$bad"; exit 1; fi

      - name: Секреты в истории и в изменениях
        run: |
          patterns='(api[_-]?key|secret|passw|token)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_-]{12,}|socks5://[^:[:space:]]+:[^@[:space:]]+@|-----BEGIN [A-Z ]*PRIVATE KEY-----|[0-9]{10}:[A-Za-z0-9_-]{30,}'
          if git grep -Ein "$patterns" $(git rev-list --all | head -200) -- . 2>/dev/null | head -20; then
            echo "Найдены строки, похожие на секреты"
            exit 1
          fi
          echo "история чиста по проверяемым шаблонам"

      - name: gitleaks (если доступен)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
